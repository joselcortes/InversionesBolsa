<!DOCTYPE html>
<html lang="es-CL">
<head>
  <!-- Reemplazado por el valor de `--base-href` al compilar. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Tus inversiones en acciones de EE.UU., explicadas simple y en pesos chilenos.">
  <meta name="theme-color" content="#0A0E14">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">

  <!-- Para "Agregar a pantalla de inicio" en iPhone y Android -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Inversiones">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Inversiones</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { background: #0A0E14; margin: 0; height: 100%; }
    #cargando {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      color: #9CA3AF; font-family: Roboto, Arial, sans-serif; font-size: 15px;
    }
    #cargando .punto {
      width: 44px; height: 44px; border-radius: 50%;
      border: 4px solid #1f2937; border-top-color: #3B82F6;
      animation: girar 0.9s linear infinite;
    }
    @keyframes girar { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="cargando"><div class="punto"></div>Cargando tus inversiones…</div>
  <script src="quitar_carga.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
